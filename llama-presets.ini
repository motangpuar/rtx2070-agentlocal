# TurboQuant Presets — per-model tuning for router mode

# ============================================================
# MoE MODELS — tune moe-cache and n-cpu-moe per model
# ============================================================

# --- 30B MoE (30B total, 3B active) — 48 layers, 512 experts ---
# Baseline observed: 4.5 GB VRAM @ n-cpu-moe=40, moe-cache=40
# Target: ~7.5 GB. Push moe-cache up, n-cpu-moe down.
[Qwen3-Coder-30B-A3B-Q3_K_M]
model = /models/Qwen3-Coder-30B-A3B-Instruct-Q3_K_M.gguf
ctx-size = 40960
n-cpu-moe = 32
moe-cache = 1024
load-mode = none
cache-type-k = q8_0
cache-type-v = turbo4
temp = 0.2
repeat-penalty = 1.05

# --- 80B MoE REAP (80B total) — 16.1 GB file, RAM-tight ---
# Cold expert source likely exceeds 16 GB RAM.
# Use mmap fallback, keep context small, keep most layers on CPU.
[Qwen3-Coder-Next-REAP-IQ2_XXS]
model = /models/Qwen3-Coder-Next-REAP.i1-IQ2_XXS.gguf
ctx-size = 8192
n-cpu-moe = 44
moe-cache = 512
load-mode = none
cache-type-k = q8_0
cache-type-v = turbo4
temp = 0.2
repeat-penalty = 1.05

# --- gpt-oss-20b MoE (21B total, 3.6B active) — smaller, aggressive ---
# Fewer layers, fewer experts. More can live on GPU.
[gpt-oss-20b]
model = /models/gpt-oss-20b-Q5_K_M.gguf
ctx-size = 40960
cache-type-k = q8_0
cache-type-v = q4_0
moe-cache = 512
n-cpu-moe = 12
temp = 0.2
top-k = 40
top-p = 0.95
repeat-penalty = 1.05
flash-attn = true
load-mode = none
batch-size = 2048
ubatch-size = 1024

[gpt-oss-20b-Vanilla]
model = /models/gpt-oss-20b-Q5_K_M.gguf
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0
flash-attn = true
load-mode = none

