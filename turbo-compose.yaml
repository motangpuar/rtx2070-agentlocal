services:
  llama-turbo:
    image: turboquant:feature
    container_name: llama-turbo
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:Z
      - ./llama-presets.ini:/etc/llama-presets.ini:Z
    shm_size: "2gb"
    devices:
      - nvidia.com/gpu=all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ulimits:
      memlock: -1
      nofile: 65535
    security_opt:
      - label=disable
    entrypoint: ["/usr/local/bin/llama-server"]
    command: >
      --models-preset /etc/llama-presets.ini
      --host 0.0.0.0
      --port 8080
      --threads 12
      --parallel 1
      --jinja
      --models-max 1
      --metrics
